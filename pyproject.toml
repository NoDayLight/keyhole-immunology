[build-system]
requires = ["setuptools==75.8.2"]
build-backend = "setuptools.build_meta"

[project]
name = "keyhole-immunology"
version = "0.1.0"
description = "Offline cancer-immunology neoantigen comprehension tool"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.2.3",
  "torch==2.6.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "ruff==0.11.0",
]

[project.scripts]
keyhole = "keyhole.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keyhole = [
  "resources/data/SOURCES.md",
  "resources/data/iedb/*.gz",
  "resources/data/iedb/binder/*.json",
  "resources/data/iedb/binder/*.npz",
  "resources/data/self_peptidome/*.gz",
  "resources/data/hla_freq/*.tsv",
  "resources/data/literature/*.tsv",
  "resources/data/residues/famous_proteins.json",
  "resources/data/pdb/*.pdb",
  "resources/web/*.js",
  "resources/validation/*.json",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
